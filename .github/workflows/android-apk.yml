# Builds the everyday Quire APK (npm run apk) on every push, so a phone can
# install the app without a computer: open the run on GitHub, download the
# "Quire-apk" artifact, unzip it, and open the .apk on the phone.
name: Android APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run apk
      - uses: actions/upload-artifact@v4
        with:
          name: Quire-apk
          path: dist/*.apk
          if-no-files-found: error
