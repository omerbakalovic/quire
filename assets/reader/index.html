<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"
    />
    <title>Quire reader</title>
  </head>
  <body>
    <p id="status">Reader page</p>
    <script>
      (function () {
        function onMessage(event) {
          var data = event.data;
          if (typeof data !== "string") return;
          var message;
          try {
            message = JSON.parse(data);
          } catch (error) {
            return;
          }
          if (!message || message.type !== "ping" || typeof message.id !== "string") return;
          var reply = JSON.stringify({ type: "pong", id: message.id });
          window.__quireReply = reply;
          if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
            window.ReactNativeWebView.postMessage(reply);
          }
        }
        document.addEventListener("message", onMessage);
        window.addEventListener("message", onMessage);
      })();
    </script>
  </body>
</html>
